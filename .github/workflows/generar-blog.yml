name: Generar Blog Automático

on:
  push:
    paths:
      - "blog/*.html"
      - "scripts/generar-blog.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar listado del blog y sitemap
        run: node scripts/generar-blog.js

      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add blog/articulos.json blog/index.html index.html sitemap.xml

          git commit -m "Actualizar artículos del blog y sitemap" || exit 0

          git push
