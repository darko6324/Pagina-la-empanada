<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog de La Empanada Guerrera | Empanadas, recetas e historias</title>
<meta name="description" content="Historias, productos y consejos de La Empanada Guerrera.">
<link rel="icon" type="image/webp" href="/assets/empanadas-la-empanada-guerrera-bogota.webp">
<style>
:root{--cream:#f2ecd7;--brown:#1a0e05;--gold:#f7b314;--red:#d4380c}
body{margin:0;background:var(--cream);color:var(--brown);font-family:Poppins,Arial,sans-serif}
.wrap{max-width:1180px;margin:auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:center}
.logo{height:55px}
nav a{margin:10px;text-decoration:none;color:var(--brown);font-weight:bold}
.hero{text-align:center;padding:60px 20px}
.hero h1{font-size:clamp(2.4rem,5vw,4rem)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:25px}
.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 12px 30px #0002;text-decoration:none;color:inherit}
.card img{width:100%;height:260px;object-fit:cover}
.body{padding:22px}
.tag{color:var(--red);font-weight:bold}
.btn{background:var(--red);color:white;padding:14px 25px;border-radius:10px;text-decoration:none}
.cta{margin:50px 0;background:var(--brown);color:white;padding:40px;border-radius:20px;text-align:center}
</style>

<style>
.blog-grid-auto{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:25px;
}
.blog-card-auto{
background:#fff;
border-radius:18px;
overflow:hidden;
box-shadow:0 12px 30px rgba(0,0,0,.12);
text-decoration:none;
color:inherit;
display:flex;
flex-direction:column;
}
.blog-card-auto img{
width:100%;
height:260px;
object-fit:cover;
}
.blog-card-auto .body{
padding:22px;
}
.blog-card-auto button{
background:#d4380c;
color:white;
border:0;
padding:12px 20px;
border-radius:10px;
cursor:pointer;
}
.pagination{
display:flex;
justify-content:center;
gap:10px;
margin:35px 0;
}
.pagination button{
background:#f7b314;
border:0;
padding:10px 15px;
border-radius:8px;
}
@media(max-width:900px){
.blog-grid-auto{grid-template-columns:1fr;}
}
</style>

</head>
<body>
<div class="wrap">
<header>
<a href="/"><img class="logo" src="/assets/logo-la-empanada-guerrera.webp"></a>
<nav><a href="/">Inicio</a><a href="/blog/">Blog</a></nav>
</header>

<section class="hero">
<h1>Historias y secretos de nuestras empanadas</h1>
<p>Productos, procesos, recetas y todo lo que hay detrás de La Empanada Guerrera.</p>
</section>

<section id="lista-blog"></section><div id="paginador" class="pagination"></div>

<section class="cta">
<h2>¿Quieres empanadas para tu negocio o evento?</h2>
<a class="btn" target="_blank" rel="noopener" href="https://wa.me/573239102290">Cotizar por WhatsApp</a>
</section>
</div>


<script>
const porPagina = 9;
let pagina = 1;
let articulos = [];

fetch('articulos.json')
.then(r => r.json())
.then(data => {
  articulos = data.sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
  renderBlog();
});

function renderBlog(){
 const inicio=(pagina-1)*porPagina;
 const posts=articulos.slice(inicio,inicio+porPagina);

 document.querySelector('#lista-blog').innerHTML =
 `<div class="blog-grid-auto">${
 posts.map(p=>`
 <a class="blog-card-auto" href="${p.url}">
 <img src="${p.imagen}" alt="${p.titulo}" loading="lazy">
 <div class="body">
 <strong>${p.fecha}</strong>
 <h2>${p.titulo}</h2>
 <p>${p.descripcion || ''}</p>
 <button>Leer artículo</button>
 </div>
 </a>`).join('')
 }</div>`;

 const total=Math.ceil(articulos.length/porPagina);
 document.querySelector('#paginador').innerHTML =
 Array.from({length:total},(_,i)=>
 `<button onclick="pagina=${i+1};renderBlog()">${i+1}</button>`
 ).join('');
}
</script>

</body>
</html>
